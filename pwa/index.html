<!doctype html>
<html lang="vi" data-calculator="on">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Máy tính cá nhân. Tính toán nhanh, sử dụng ngoại tuyến."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=2" />
    <link rel="icon" href="/icon-192.png?v=2" type="image/png" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/calculator.css" />
    <meta name="apple-mobile-web-app-title" content="Máy tính" />
    <title>Máy tính</title>
    <script src="/vendor/jsQR.js" defer></script>
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main id="calculator" aria-label="Máy tính">
      <div class="calculator-toolbar">
        <button class="calculator-tool" id="calculator-history-button" aria-label="Lịch sử phép tính" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 5.5V12H7"/></svg></button>
        <button class="calculator-tool" id="calculator-basic-button" aria-label="Máy tính cơ bản"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="2" width="13" height="20" rx="3"/><path d="M8.5 5.5h7v4h-7zM9 13h.01M12 13h.01M15 13h.01M9 16h.01M12 16h.01M15 16h.01M9 19h.01M12 19h.01M15 19h.01"/></svg></button>
      </div>
      <section class="calculator-history" id="calculator-history" aria-label="Lịch sử phép tính" hidden><h2>Lịch sử</h2><p id="calculator-history-empty">Chưa có phép tính nào.</p><div class="calculator-history-list" id="calculator-history-list"></div></section>
      <div class="calculator-screen" id="calculator-screen"><div id="calculator-expression"></div><output id="calculator-display" aria-live="polite">0</output></div>
      <div class="calculator-keys">
        <button class="utility calculator-delete" data-key="backspace" aria-label="Xóa một chữ số"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M11 5h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H11L2 14Z M13 10l7 8m0-8-7 8"/></svg></button><button class="utility" data-key="AC" aria-label="Xóa tất cả">AC</button><button class="utility" data-key="%" aria-label="Phần trăm">%</button><button class="operator" data-key="/" aria-label="Chia">÷</button>
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="operator" data-key="*" aria-label="Nhân">×</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button class="operator" data-key="-" aria-label="Trừ">−</button>
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button class="operator" data-key="+" aria-label="Cộng">+</button>
        <button class="calculator-sign" data-key="±" aria-label="Đổi dấu">+/−</button><button data-key="0">0</button><button data-key="." aria-label="Dấu thập phân">,</button><button class="operator" data-key="=" aria-label="Bằng">=</button>
      </div>
    </main>
    <div id="app" hidden inert>
      <div class="boot">
        <img src="/icon.svg" alt="" width="64" height="64" />
        <h1>Lantern</h1>
        <p>Đang mở không gian của bạn…</p>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
    <noscript>Bật JavaScript để sử dụng máy tính.</noscript>
  </body>
</html>
