name: Lantern
options:
  bundleIdPrefix: vn.lantern
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: '1.2.4'
    CURRENT_PROJECT_VERSION: '10204'
targets:
  Lantern:
    type: application
    platform: iOS
    sources: [Lantern]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.lantern.companion
        INFOPLIST_FILE: Lantern/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': Lantern/Simulator.entitlements
    scheme:
      testTargets: [LanternTests, LanternUITests]
  LanternTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LanternTests]
    dependencies:
      - target: Lantern
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LanternUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LanternUITests]
    dependencies:
      - target: Lantern
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
