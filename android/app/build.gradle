plugins { id 'com.android.application' }
def releaseVersion = providers.gradleProperty('releaseVersion').getOrElse('1.2.3')
if (!(releaseVersion ==~ /\d{1,3}\.\d{1,2}\.\d{1,2}/)) throw new GradleException('releaseVersion must be major.minor.patch (minor/patch below 100)')
def versionParts = releaseVersion.tokenize('.').collect { it.toInteger() }
android {
    namespace 'vn.lantern.companion'
    compileSdk 35
    defaultConfig { applicationId 'vn.lantern.companion'; minSdk 26; targetSdk 35; versionCode versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]; versionName releaseVersion; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('LANTERN_KEYSTORE')) {
                storeFile file(System.getenv('LANTERN_KEYSTORE')); storePassword System.getenv('LANTERN_STORE_PASSWORD')
                keyAlias 'lantern'; keyPassword System.getenv('LANTERN_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'; implementation 'androidx.core:core:1.15.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1'; androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
