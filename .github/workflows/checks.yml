name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/Lantern.App/Lantern.App.csproj -c Release --nologo
      - run: dotnet run --project tests/Lantern.Tests/Lantern.Tests.csproj -c Release
      - run: ./scripts/Test-UpdateInstaller.ps1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --prefix pwa --ignore-scripts
      - run: ./scripts/Test-Web.ps1
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --prefix pwa --ignore-scripts
      - run: node --test relay/tests/relay.test.mjs pwa/tests/model.test.mjs pwa/tests/pc.test.mjs pwa/tests/qr-scanner.test.mjs pwa/tests/calculator.test.mjs pwa/tests/calculator-lock.test.mjs pwa/tests/camouflage.test.mjs
