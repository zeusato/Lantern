name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/Lantern.App/Lantern.App.csproj -c Release --nologo
      - run: dotnet run --project tests/Lantern.Tests/Lantern.Tests.csproj -c Release
      - run: ./scripts/Test-UpdateInstaller.ps1
      - run: ./scripts/Test-UpdateInstaller.ps1
