name: Windows Android release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./scripts/Package-Release.ps1 -Version $version
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME release-output/Lantern-Windows-x64.zip release-output/SHA256SUMS.txt --draft --verify-tag --notes "Sửa lỗi và cải thiện trải nghiệm." --title "Lantern $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
  android:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Select Android package
        id: android-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [[ "$previous" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && git diff --quiet "$previous" HEAD -- android ':!android/app/src/androidTest' ':!android/app/src/test' src/Lantern.App/Assets/Emoji src/Lantern.Core/emoji-shortcodes.json; then
            echo "reuse=$previous" >> "$GITHUB_OUTPUT"
          fi
      - name: Reuse published APK and checksum
        if: steps.android-source.outputs.reuse != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.android-source.outputs.reuse }}
        working-directory: android
        run: |
          gh release download "$PREVIOUS_TAG" --pattern Lantern-Android.apk --pattern ANDROID-SHA256SUMS.txt
          sha256sum --check ANDROID-SHA256SUMS.txt
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.android-source.outputs.reuse == ''
        with:
          distribution: temurin
          java-version: '17'
      - name: Build signed APK
        if: steps.android-source.outputs.reuse == ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LANTERN_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          umask 077
          export LANTERN_KEYSTORE="$RUNNER_TEMP/lantern-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$LANTERN_KEYSTORE"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease lintRelease "-PreleaseVersion=${GITHUB_REF_NAME#v}" --console=plain
          cp app/build/outputs/apk/release/app-release.apk Lantern-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Lantern-Android.apk
          sha256sum Lantern-Android.apk > ANDROID-SHA256SUMS.txt
      - name: Publish APK to matching release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/Lantern-Android.apk)
          version=$(sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p" <<< "$badging")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release upload "$GITHUB_REF_NAME" "android/Lantern-Android.apk#Android v$version" android/ANDROID-SHA256SUMS.txt --clobber
  publish:
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify complete release before making it public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir release-verify
          gh release download "$GITHUB_REF_NAME" --dir release-verify
          cd release-verify
          test -f Lantern-Windows-x64.zip
          test -f Lantern-Android.apk
          sha256sum --check SHA256SUMS.txt
          sha256sum --check ANDROID-SHA256SUMS.txt
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
