name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./scripts/Package-Release.ps1 -Version $version
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME release-output/Lantern-Windows-x64.zip release-output/SHA256SUMS.txt --verify-tag --notes-file docs/RELEASE-NOTES.md --title "Lantern $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
