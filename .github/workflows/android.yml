name: Android checks
on:
  push:
    branches: [main]
    paths: ['android/**', 'tests/MobileInteropFixture/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'tests/MobileInteropFixture/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Build and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PreleaseVersion=9.9.9 --console=plain
          mkdir -p app/build/update-fixture
          cp app/build/outputs/apk/debug/app-debug.apk app/build/update-fixture/candidate.apk
          ./gradlew assembleDebug assembleDebugAndroidTest lintDebug --console=plain
      - name: Test on Android API ${{ matrix.api }} emulator
        timeout-minutes: 15
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sdkmanager 'system-images;android-${{ matrix.api }};google_apis;x86_64' 'emulator'
          echo no | avdmanager create avd --force --name lantern-test --package 'system-images;android-${{ matrix.api }};google_apis;x86_64' --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -avd lantern-test -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > /tmp/lantern-emulator.log 2>&1 &
          if ! timeout 180 adb wait-for-device; then cat /tmp/lantern-emulator.log; exit 1; fi
          for n in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1' ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          dotnet build tests/MobileInteropFixture -c Release --nologo
          dotnet tests/MobileInteropFixture/bin/Release/net10.0/MobileInteropFixture.dll > /tmp/lantern-interop.json 2> /tmp/lantern-interop.log &
          for n in $(seq 1 20); do
            if [ -s /tmp/lantern-interop.json ]; then break; fi
            sleep 1
          done
          PC_PIN=$(jq -r .pc /tmp/lantern-interop.json)
          adb reverse tcp:45854 tcp:45854
          timeout 5 openssl s_client -connect 127.0.0.1:45854 -brief < /dev/null || true
          cd android
          ./gradlew connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.pcPin=$PC_PIN" --console=plain
          mkdir -p build/screenshots
          adb pull /data/local/tmp/lantern-qa/. build/screenshots/
      - name: Emulator diagnostics
        if: failure()
        timeout-minutes: 1
        run: |
          cat /tmp/lantern-emulator.log || true
          cat /tmp/lantern-interop.log || true
          timeout 10 "$ANDROID_HOME/platform-tools/adb" logcat -d -s TestRunner Conscrypt System.err AndroidRuntime || true
      - name: Collect Android screenshots
        if: always()
        run: |
          mkdir -p android/build/screenshots
          timeout 10 "$ANDROID_HOME/platform-tools/adb" pull /data/local/tmp/lantern-qa/. android/build/screenshots/ || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-qa-${{ matrix.api }}
          path: |
            android/app/build/reports/
            android/build/screenshots/
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
