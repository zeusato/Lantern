name: iOS IPA
on:
  push:
    branches: [main, 'codex/ios-ipa']
    paths: ['ios/**', 'scripts/*ios*', 'tests/MobileInteropFixture/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'scripts/*ios*', 'tests/MobileInteropFixture/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Install project generator
        run: brew install xcodegen openssl@3
      - name: Build arm64 IPA for Scarlet
        run: bash scripts/build-ios.sh
      - name: Test on iOS Simulator with real .NET TLS
        run: bash scripts/test-ios.sh
      - name: Collect simulator screenshots
        if: always()
        run: |
          if [ -d ios/build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path ios/build/Tests.xcresult --output-path ios/build/screenshots
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Lantern-iOS-unsigned
          path: ios/output/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: iOS-QA
          path: |
            ios/build/Tests.xcresult
            ios/build/ios-simulator.png
            ios/build/screenshots/
            /tmp/lantern-ios-fixture.log
            /tmp/lantern-ios-relay.log
          retention-days: 7
